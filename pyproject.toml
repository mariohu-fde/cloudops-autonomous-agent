[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudops-autonomous-agent"
version = "0.1.0"
description = "Autonomous Cloud Root-Cause Analysis (RCA) & Remediation Agent with Falsification-First StateGraph and Zero-Bloat SQLite-JSON1 Tool Compaction"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mario Hu", email = "mariohu@users.noreply.github.com" }
]
dependencies = [
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
